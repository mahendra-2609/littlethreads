name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR checks are worth cancelling; a deploy is not. Cancelling main
  # mid-run could stop between the D1 migration and the publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the site and the Pages Functions
        run: npm run typecheck
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://littlethreads.store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Fail loudly and early if the repository secrets are missing, rather than
      # letting wrangler report a confusing "no API token" error further down.
      - name: Check deployment secrets are present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=1
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it under Settings → Secrets and variables → Actions → Repository secrets (a Variable will not work)."
            ok=0
          else
            echo "CLOUDFLARE_API_TOKEN present (${#TOKEN} characters)"
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty. Add it in the same place."
            ok=0
          else
            echo "CLOUDFLARE_ACCOUNT_ID present (${#ACCOUNT} characters)"
          fi
          [ "$ok" = "1" ]

      # Idempotent: schema.sql is written with IF NOT EXISTS throughout.
      # -y answers the confirmation prompt, which has no TTY to answer it in CI.
      - name: Apply the D1 schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute littlethreads --remote --file=./schema.sql -y

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=littlethreads --branch=main
